services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classifier
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d classifier"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "6767:7860"
    env_file:
      - .env
    volumes:
      - ./backend/app:/app/app
      - ./Results:/Results
    command: uvicorn app.main:app --host 0.0.0.0 --port 7860 --reload
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - BACKEND_URL=http://backend:7860
    depends_on:
      - backend

volumes:
  pgdata:
